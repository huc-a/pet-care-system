server:
  port: 8082
spring:
  application:
    name: pet-system
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:pet}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
pet:
  upload-dir: /home/hatch/workspace/pet-care-system/uploads
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: 24
logging:
  level:
    com.pet: info
